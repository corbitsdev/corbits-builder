name: Bug report
description: Something in Builder does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands, API requests or project steps that show the problem.
      placeholder: |
        1. bun run dev
        2. ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse HEAD`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, `bun --version`, and Postgres version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove secrets, tokens and API keys first.
      render: text
