name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
      test: ${{ steps.filter.outputs.test }}
      e2e: ${{ steps.filter.outputs.e2e }}
      e2e-builds: ${{ steps.filter.outputs.e2e_builds }}
      pins: ${{ steps.filter.outputs.pins }}
      vendor: ${{ steps.filter.outputs.vendor }}
      environment: ${{ steps.filter.outputs.environment }}
      build-tests: ${{ steps.build-tests.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: test/e2e/builds
      - id: build-tests
        run: echo "files=$(cd test/e2e/builds && ls *.test.ts | jq -Rcs 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - "bun.lock"
              - "patches/**"
              - "package.json"
              - "tsconfig.json"
              - ".github/**"
            lint:
              - *shared
              - "apps/**"
              - "packages/**"
              - "plugins/**"
              - "workflows/**"
              - "test/**"
              - "scripts/**"
              - "vendor/**"
              - ".oxlintrc.json"
            typecheck:
              - *shared
              - "apps/**"
              - "packages/**"
              - "plugins/**"
              - "workflows/**"
              - "test/**"
              - "scripts/**"
              - "vendor/**"
            test:
              - *shared
              - "apps/**"
              - "packages/**"
              - "plugins/**"
              - "workflows/**"
              - "test/integration/**"
              - "vendor/**"
            e2e:
              - *shared
              - "apps/hub/**"
              - "apps/web/**"
              - "packages/**"
              - "plugins/**"
              - "workflows/**"
              - "test/e2e/**"
              - "vendor/**"
            e2e_builds:
              - *shared
              - "apps/hub/**"
              - "packages/**"
              - "plugins/**"
              - "test/e2e/**"
              - "test/fixtures/**"
              - "vendor/**"
            pins:
              - *shared
              - "**/package.json"
              - "scripts/verify-pins.ts"
            vendor:
              - *shared
              - "vendor/**"
              - "scripts/verify-vendor.ts"
            environment:
              - *shared
              - ".env.*.example"
              - "**/environment.ts"
              - "packages/environment/**"
              - "scripts/verify-environment.ts"

  checks:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/corbits-builder/workflow-packages
          key: workflow-packages-${{ runner.os }}-${{ hashFiles('apps/**', 'packages/**', 'plugins/**', 'workflows/**', 'vendor/**', 'patches/**', 'bun.lock', 'package.json', 'tsconfig.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/corbits-builder/workflow-packages
          key: workflow-packages-${{ runner.os }}-${{ hashFiles('apps/**', 'packages/**', 'plugins/**', 'workflows/**', 'vendor/**', 'patches/**', 'bun.lock', 'package.json', 'tsconfig.json') }}
      - uses: ./.github/actions/setup
      # Each check runs even when an earlier one failed, so every check reports its own result.
      - name: format:check
        run: bun run format:check
      - name: lint
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lint == 'true') }}
        run: |
          bun run lint
          bun run boundaries
      - name: typecheck
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.typecheck == 'true') }}
        run: bun run typecheck
      - name: pins:verify
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.pins == 'true') }}
        run: bun run pins:verify
      - name: vendor:verify
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.vendor == 'true') }}
        run: bun run vendor:verify
      - name: environment:verify
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.environment == 'true') }}
        run: bun run environment:verify

  test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run test

  e2e:
    name: e2e (${{ matrix.shard }}/2)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: 5432
      E2E_DB_USER: postgres
      E2E_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/postgres
      - uses: ./.github/actions/setup
      - id: playwright
        run: echo "version=$(bunx playwright --version)" >> "$GITHUB_OUTPUT"
      - id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: bunx playwright install chromium
      # test/e2e/builds runs in the e2e-builds job, which installs the sandbox libraries a build needs.
      # The tests that install a plugin copy it into the shared plugins folder, and the hub reads that
      # folder once per module load, so files run one at a time, each in a fresh module registry.
      - run: >-
          bun --conditions=intx-src test ./test/e2e
          --path-ignore-patterns='test/e2e/builds/**'
          --shard=${{ matrix.shard }}/2 --timings=test/e2e/timings.json --isolate

  e2e-builds:
    name: e2e-builds (${{ matrix.file }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e-builds == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.changes.outputs.build-tests) }}
    env:
      FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/corbits-builder/workflow-packages
          key: workflow-packages-${{ runner.os }}-${{ hashFiles('apps/**', 'packages/**', 'plugins/**', 'workflows/**', 'vendor/**', 'patches/**', 'bun.lock', 'package.json', 'tsconfig.json') }}
      - uses: ./.github/actions/postgres
      - uses: ./.github/actions/setup
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            bubblewrap socat unzip fonts-liberation libasound2t64
            libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libdbus-1-3
            libexpat1 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libx11-6 libxcb1
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun --conditions=intx-src test "./test/e2e/builds/$FILE"
        env:
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: 5432
          E2E_DB_USER: postgres
          E2E_DB_PASSWORD: postgres
