name: Publish UI visual evidence

on:
  workflow_run:
    workflows: [UI visual evidence]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

# Serialize publishers, including fork runs whose pull_requests field is empty.
concurrency:
  group: visual-comment-publisher
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # workflow_run resolves github.sha to the trusted default branch, not the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/visual
      - run: python3 scripts/visual/publish.py
        env:
          GH_TOKEN: ${{ github.token }}
