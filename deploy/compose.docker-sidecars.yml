# Lets the hub also start sidecars as containers on the host's Docker daemon:
#   docker compose --env-file .env.hub --project-directory . -f deploy/compose.yml -f deploy/compose.docker-sidecars.yml up -d
# `sidecar-image` pulls SIDECAR_IMAGE onto that daemon before the hub starts;
# `docker compose pull` refreshes it after a channel change.
# From source, `bun run docker:sidecar` builds corbits-builder-sidecar:local;
# set SIDECAR_IMAGE to that.
# Access to the socket is root on the host.
services:
  sidecar-image:
    image: ${SIDECAR_IMAGE:-ghcr.io/corbitsdev/corbits-builder-sidecar:${BUILDER_VERSION:-rc}}
    entrypoint: ["true"]
    restart: "no"
  hub:
    depends_on:
      sidecar-image:
        condition: service_completed_successfully
    environment:
      SIDECAR_IMAGE: ${SIDECAR_IMAGE:-ghcr.io/corbitsdev/corbits-builder-sidecar:${BUILDER_VERSION:-rc}}
      SIDECAR_DOCKER_HOST: unix:///var/run/docker.sock
    # The group that owns the socket inside the container: 0 on Docker Desktop,
    # the host's docker group id (`getent group docker`) on Linux.
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
