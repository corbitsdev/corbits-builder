<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Streak &amp; Habit Tracker — Monochrome</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell" data-screen="today">
      <section data-state="populated">
        <div class="card">
          <h1 data-testid="today-title">Today — 75% Complete</h1>
          <p>4 daily habits · 18-day best streak</p>
        </div>
      </section>
      <section data-state="empty" hidden>
        <div class="card"><p>No habits yet.</p></div>
      </section>
    </main>
  </body>
</html>
